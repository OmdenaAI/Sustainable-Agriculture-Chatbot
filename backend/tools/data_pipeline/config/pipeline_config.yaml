# ETL Pipeline Configuration

tools:
  extractor:
    enabled: true
    # For test if enabled is false, the tool wont run but you can provide extracted_paths for chunker to process
    # extracted_paths:
    #   - /Users/timhazed/tmp/output/extracted_mini/doc_0002
    #   - /Users/timhazed/tmp/output/extracted/doc_0002

    docker:
      image: "extract-normalize:latest"
      input_volume: "/Users/timhazed/tmp/input:/app/input"
      output_volume: "/Users/timhazed/tmp/output_20250507:/app/output"
      env_file: "~/src/python/.env_mini"
      config_path: "/app/config/config.yaml"
  
  chunker:
    enabled: true
    # For test if enabled is false, the tool wont run but you can provide chunked_paths for insert_db to process
    #chunked_paths:
    #   - /Users/timhazed/tmp/output/chunked_new/doc_0002
    #   - /Users/timhazed/tmp/output/chunked/doc_0002
    chunk_size: 1024
    overlap_percentage: 20
    chunker_technique: "overlap"
    docker:
      image: "chunker:latest"
      input_volume: "/Users/timhazed/tmp/output_20250507/extracted:/app/input/"
      output_volume: "/Users/timhazed/tmp/output_20250507:/app/output"
      env_file: "~/src/python/.env_mini"
  
  insert_db:
    enabled: true
    docker:
      image: "insert-db:latest"
      input_volume: "/Users/timhazed/tmp/output_20250507/chunked:/app/input"
      # Not neccessary
      #output_volume: "./output:/app/output"
      env_file: "~/src/python/.env_mini"

# Runtime configuration
timeouts:
  extraction: 600  # 10 minutes
  chunking: 300    # 5 minutes
  db_insertion: 1200  # 20 minutes 

log_dir: "/Users/timhazed/tmp/logs"