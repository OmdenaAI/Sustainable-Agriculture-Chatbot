        - /home/balam/Desktop/workspace/volunteers/omdena/sustainable_agriculture_chatbot/official/Sustainable-Agriculture-Chatbot/backend/tools/data_pipeline/output/extracted/doc_0002
        - /home/balam/Desktop/workspace/volunteers/omdena/sustainable_agriculture_chatbot/official/Sustainable-Agriculture-Chatbot/backend/tools/data_pipeline/output/extracted/doc_0003
        - /home/balam/Desktop/workspace/volunteers/omdena/sustainable_agriculture_chatbot/official/Sustainable-Agriculture-Chatbot/backend/tools/data_pipeline/output/extracted/doc_0004
        - /home/balam/Desktop/workspace/volunteers/omdena/sustainable_agriculture_chatbot/official/Sustainable-Agriculture-Chatbot/backend/tools/data_pipeline/output/extracted/doc_0005
        - /home/balam/Desktop/workspace/volunteers/omdena/sustainable_agriculture_chatbot/official/Sustainable-Agriculture-Chatbot/backend/tools/data_pipeline/output/extracted/doc_0006
        - /home/balam/Desktop/workspace/volunteers/omdena/sustainable_agriculture_chatbot/official/Sustainable-Agriculture-Chatbot/backend/tools/data_pipeline/output/extracted/doc_0007  
        - /home/balam/Desktop/workspace/volunteers/omdena/sustainable_agriculture_chatbot/official/Sustainable-Agriculture-Chatbot/backend/tools/data_pipeline/output/extracted/doc_0008

    docker:
      image: "extract-normalize:latest"
      input_volume: "/Users/timhazed/tmp/input:/app/input"
      output_volume: "/Users/timhazed/tmp/output:/app/output"
      env_file: "~/src/python/.env_mini"
      config_path: "/app/config/config.yaml"
  
  chunker:
    enabled: true
    # For test if enabled is false, the tool wont run but you can provide chunked_paths for insert_db to process
    # chunked_paths:
    #   - /Users/timhazed/tmp/output/chunked/doc_0001
    #   - /Users/timhazed/tmp/output/chunked/doc_0002
    chunk_size: 256
    chunk_overlap: 20
    chunker_technique: "overlap"
    docker:
      image: "document-chunker:latest"
      input_volume: "/home/balam/Desktop/workspace/volunteers/omdena/sustainable_agriculture_chatbot/official/Sustainable-Agriculture-Chatbot/backend/tools/data_pipeline/output/extracted/:/app/input/"
      output_volume: "/home/balam/Desktop/workspace/volunteers/omdena/sustainable_agriculture_chatbot/official/Sustainable-Agriculture-Chatbot/backend/tools/chunks/output:/app/output"
      # env_file: ".env.chunking"
  
  insert_db:
    enabled: false
    docker:
      image: "db-inserter:latest"
      input_volume: "./output:/app/input"
      output_volume: "./output:/app/output"
      env_file: ".env.db"

# Runtime configuration
timeouts:
  extraction: 600  # 10 minutes
  chunking: 300    # 5 minutes
  db_insertion: 600  # 10 minutes 

log_dir: "./logs"